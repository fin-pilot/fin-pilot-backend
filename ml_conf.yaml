dataset:
  name: mitulshah/transaction-categorization
  release_url: "https://github.com/PalamarchukOleksii/personal-finance-management-system/releases/download/v0.0.1/transaction_classifier.pkl"

data:
  test_size: 0.2
  random_state: 42

model:
  path: ml/artifacts/transaction_classifier.pkl

tfidf:
  analyzer: char_wb
  ngram_range: [2, 5]
  min_df: 5
  max_df: 0.5

svm:
  class_weight: balanced
  max_iter: 2000
  random_state: 42