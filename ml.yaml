dataset:
  categorizer:
    name: mitulshah/transaction-categorization

  forecaster:
    name: artemkabseu/financial-transactions-dataset-expenses-and-income


data:
  test_size: 0.2
  random_state: 42


categorizer:
  model:
    path: ml/artifacts/categorizer.pkl

    release_url: "https://github.com/PalamarchukOleksii/personal-finance-management-system/releases/download/v0.0.1/transaction_classifier.pkl"

  tfidf:
    analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 5
    max_df: 0.5

  svm:
    class_weight: balanced
    max_iter: 2000
    random_state: 42


forecaster:
  model:
    path: ml/artifacts/forecaster.pkl

    release_url: "https://github.com/PalamarchukOleksii/personal-finance-management-system/releases/download/v0.0.1/sarima_model.pkl"

  sarima:
    seasonal: true

    freq: W
    seasonal_period: 4

    stepwise: true
    trace: false

    error_action: ignore
    suppress_warnings: true

    information_criterion: aic

    max_p: 5
    max_q: 5
    max_d: 2

    max_P: 2
    max_Q: 2
    max_D: 1